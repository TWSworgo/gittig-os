services:
  postgres:
    image: postgres:16-alpine
    container_name: gittig_postgres
    restart: always
    environment:
      POSTGRES_USER: gittig_admin
      POSTGRES_PASSWORD: gittig_dev_password_2026
      POSTGRES_DB: gittig_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gittig_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  gitea:
    image: gitea/gitea:1.22
    container_name: gittig_git_core
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__security__INSTALL_LOCK=true
    ports:
      - "3001:3000"
      - "2223:22"
    volumes:
      - giteadata:/data

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: gittig_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  redisdata:
  giteadata:
  qdrantdata:
