services:
  postgres:
    image: postgres:16-alpine
    container_name: gittig_postgres
    restart: always
    environment:
      POSTGRES_USER: gittig_admin
      POSTGRES_PASSWORD: gittig_dev_password_2026
      POSTGRES_DB: gittig_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gittig_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
